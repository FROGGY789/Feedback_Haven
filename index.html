<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Haven</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23f2761c'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='%23fff4e8' font-family='Georgia,serif'>?!</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- ============ 1. 입장 (암호) ============ -->
  <section id="gate-view" class="view">
    <div class="gate">
      <div class="gate__brand">
        <div class="gate__deco gate__deco--1"></div>
        <div class="gate__deco gate__deco--2"></div>
        <div class="gate__kicker">
          <span class="logo-dot">?!</span>
          <span class="js-kicker"></span>
        </div>
        <div class="gate__hero">
          <h1 class="display js-site-title">Feedback Haven</h1>
          <p class="gate__sub js-site-subtitle"></p>
          <div class="pill-row">
            <span class="pill pill--q"><b>?</b> 궁금한 점</span>
            <span class="pill pill--i"><b>!</b> 인상 깊은 점</span>
          </div>
        </div>
        <div class="gate__help js-gate-help"></div>
      </div>

      <div class="gate__panel">
        <form id="pw-form" class="pass-card">
          <div class="pass-card__label">Passcode</div>
          <div class="pass-input">
            <input id="pw-input" type="password" placeholder="암호를 입력하세요" autocomplete="off" />
            <span id="pw-len" class="pass-input__len"></span>
          </div>
          <div id="pw-error" class="pass-error" role="alert"></div>
          <div id="pw-keyboard" class="keypad" aria-label="화면 자판"></div>
          <button type="submit" class="btn btn--primary btn--block">다음</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ============ 2. 이름 선택 ============ -->
  <section id="name-view" class="view">
    <div class="name">
      <div class="kicker">Step 2 — 이름 선택</div>
      <h2 class="display display--md">어느 선생님이신가요?</h2>
      <p class="name__sub">남기는 피드백과 댓글에 이 이름이 함께 표시됩니다.</p>
      <div id="name-grid" class="person-grid"></div>
      <div id="name-custom-box" class="custombox" hidden>
        <label class="field"><span>닉네임</span>
          <input id="name-nick" type="text" placeholder="예: Sol" autocomplete="off" /></label>
        <label class="field"><span>선생님 성함</span>
          <input id="name-real" type="text" placeholder="예: 이솔다은" autocomplete="off" /></label>
      </div>
      <div class="name__foot">
        <button id="name-enter" class="btn btn--primary btn--lg" disabled>입장하기</button>
        <span id="name-hint" class="name__hint">이름을 먼저 선택해 주세요.</span>
      </div>
    </div>
  </section>

  <!-- ============ 3. 허브 (문서 목록 + 이용방법) ============ -->
  <section id="hub-view" class="view">
    <header class="hub-bar">
      <div class="hub-bar__inner">
        <div class="brand">
          <span class="logo-dot logo-dot--sm">?!</span>
          <span class="brand__name js-site-title"></span>
        </div>
        <div class="hub-bar__right">
          <span class="who js-me"></span>
          <button id="hub-signout" class="btn btn--line">나가기</button>
        </div>
      </div>
    </header>
    <main class="hub">
      <div class="hub__main">
        <div class="kicker">Materials</div>
        <h2 class="display display--md">선생님별 학습자료 · 평가계획</h2>
        <p class="hub__sub">버튼을 누르면 해당 문서로 바로 들어갑니다.</p>
        <div id="teacher-list" class="teacher-list"></div>
      </div>
      <aside class="guide">
        <div class="kicker kicker--light">How it works</div>
        <h3 class="display display--sm guide__title">이 사이트 이용 방법</h3>
        <div id="guide-steps" class="guide__steps"></div>
        <div class="guide__legend">
          <span class="pill pill--q pill--dark"><b>?</b> 궁금한 점</span>
          <span class="pill pill--i pill--dark"><b>!</b> 인상 깊은 점</span>
        </div>
      </aside>
    </main>
  </section>

  <!-- ============ 4. 문서 (PDF + 피드백) ============ -->
  <section id="doc-view" class="view">
    <header class="doc-bar">
      <button id="doc-back" class="btn btn--line">← 목록</button>
      <div class="doc-bar__title">
        <span id="doc-title" class="doc-bar__name"></span>
        <span id="doc-owner" class="doc-bar__owner"></span>
      </div>
      <div class="doc-bar__right">
        <span id="doc-qcount" class="count count--q"><b>?</b> 0</span>
        <span id="doc-icount" class="count count--i"><b>!</b> 0</span>
        <span class="who js-me"></span>
      </div>
    </header>
    <div class="doc-body">
      <div class="paper-col">
        <!-- 왼쪽 고정 도크 (항상 열림) -->
        <div class="reader-dock">
          <button type="button" data-nav="back">← 뒤로가기</button>
          <button type="button" data-nav="home">🏠 홈으로 가기</button>
          <button type="button" data-nav="materials">📚 다른 자료 보기</button>
        </div>
        <div id="pdf-pages" class="paper-scroll"></div>
        <div class="pdf-progress">
          <span id="pdf-pageinfo" class="pdf-progress__info">1 / 1</span>
          <div class="pdf-progress__track"><div id="pdf-progress-bar" class="pdf-progress__bar"></div></div>
          <span class="pdf-progress__hint">클릭=한 지점 · 드래그=범위 형광펜</span>
        </div>
        <!-- 화면 아래 중앙 플로팅 이전/다음 -->
        <div class="page-float">
          <button id="pdf-prev" class="page-float__btn" type="button">‹ 이전</button>
          <span id="pdf-float-info" class="page-float__info">1 / 1</span>
          <button id="pdf-next" class="page-float__btn" type="button">다음 ›</button>
        </div>
      </div>
      <aside class="fb-panel">
        <div class="fb-panel__head">
          <div class="fb-panel__titlerow">
            <span class="display display--sm">피드백</span>
            <span id="fb-count" class="fb-panel__count"></span>
          </div>
          <div class="fb-filters">
            <button class="fb-filter active" data-filter="all">전체</button>
            <button class="fb-filter" data-filter="question"><b>?</b> 궁금</button>
            <button class="fb-filter" data-filter="impression"><b>!</b> 인상</button>
          </div>
        </div>
        <div id="fb-list" class="fb-list"></div>
        <div class="fb-panel__foot js-deadline"></div>
      </aside>
    </div>
  </section>

  <!-- ============ 피드백 작성 팝업 (문서 위) ============ -->
  <div id="composer" class="draft">
    <form id="composer-form">
      <div class="draft__types">
        <button type="button" class="draft-type draft-type--q active" data-type="question"><b>?</b> 궁금한 점</button>
        <button type="button" class="draft-type draft-type--i" data-type="impression"><b>!</b> 인상 깊은 점</button>
      </div>
      <textarea id="composer-text" rows="3" placeholder="이 부분에서 궁금한 점을 적어주세요"></textarea>
      <div id="composer-hint" class="draft__hint"></div>
      <div class="draft__actions">
        <button type="button" id="composer-cancel" class="btn btn--soft">취소</button>
        <button type="submit" class="btn btn--primary">남기기</button>
      </div>
    </form>
  </div>

  <!-- ============ 마크(핀/범위) 클릭 팝업 · 호버 말풍선 ============ -->
  <div id="mark-pop" class="markpop"></div>
  <div id="mark-tip" class="marktip"></div>

  <!-- ============ 스크립트 ============ -->
  <script src="assets/vendor/pdfjs/pdf.min.js"></script>
  <script src="assets/vendor/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/pdf-viewer.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
