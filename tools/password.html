<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>암호 해시 생성기 — Feedback Haven</title>
  <style>
    body { font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f4f6fb; color: #1f2733; display: grid; place-items: center;
      min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #fff; padding: 32px; border-radius: 16px; width: min(92vw, 460px);
      box-shadow: 0 8px 30px rgba(31,39,51,.12); }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: #5c6773; font-size: 14px; line-height: 1.6; }
    input { font: inherit; width: 100%; padding: 12px 14px; border: 1.5px solid #e5e9f0;
      border-radius: 10px; box-sizing: border-box; margin-top: 10px; }
    .out { margin-top: 16px; background: #f4f6fb; border-radius: 10px; padding: 14px;
      font-family: ui-monospace, monospace; font-size: 13px; word-break: break-all; min-height: 20px; }
    .hint { font-size: 13px; margin-top: 14px; }
    code { background: #eef1f7; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔒 입장 암호 해시 생성기</h1>
    <p>공개 저장소에 암호를 그대로 두지 않기 위한 도구입니다.
       아래에 원하는 암호를 입력하면 SHA-256 해시가 만들어집니다.</p>
    <input id="pw" type="text" placeholder="원하는 암호를 입력하세요" autocomplete="off" />
    <div id="out" class="out">여기에 해시가 표시됩니다</div>
    <p class="hint">
      만들어진 해시를 <code>assets/js/config.js</code> 의
      <code>PASSWORD_HASH</code> 값에 붙여넣고,
      <code>PASSWORD_PLAIN</code> 은 비워두세요.
    </p>
  </div>
  <script>
    const pw = document.getElementById('pw');
    const out = document.getElementById('out');
    async function sha256(t) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
      return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
    }
    pw.addEventListener('input', async () => {
      out.textContent = pw.value ? await sha256(pw.value) : '여기에 해시가 표시됩니다';
    });
    pw.focus();
  </script>
</body>
</html>
